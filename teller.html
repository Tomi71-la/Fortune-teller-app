<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny Oracle</title>
</head>
<link rel="stylesheet" href="teller.css">
<body>
    <div class="container">
        <h1 class="glow-title">✨Destiny Oracle🌟</h1>
        <p class="subtitle">Unveil Your Cosmetic Fate</p>

     <form id="destinyForm">
        <label for="userName">Your Name</label>
        <input type="text" id="userName" placeholder="enter your Mystical Name"required>

        <label for="Zodiac">Zodiac Sign</label>
        <select id="Zodiac" required>
            <option value="">Choose your sign</option>
            <option value="Aries">Aries♈ - The Ram</option>
            <option value="Taurus">Taurus♉ - The Bull </option>
            <option value="Gemini">Gemini♊ - The Twins</option>
            <option value="Cancer">Cancer♋ - The Crabs</option>
            <option value="Leo">Leo♌ - The Lion</option>
            <option value="Virgo">Virgo♍ - The Maiden</option>
            <option value="Libra">Libra♎ - The Scales</option>
            <option value="scorpion">scorpion♏ - The scorpion</option>
            <option value="Sagittarius">Sagittarius♐ - The Archer</option>
            <option value="Capricorn">Capricorn♑ - The Goat</option>
            <option value="Aquarius">Aquarius♒ - The Water Bearer</option>
            <option value="Pisces">Pisces♓ - The Fish</option>
        </select>


        <button type="submit">Reveal Your Destiny</button>
     </form>
    
    </div>

    <div id="destinyZone">

        <h2>Destiny Zone </h2>
        <p id="destinyresult">Your faiths awaits..Enter your detials above.</p>


    </div>



 <script src="teller.js"></script>
    
</body>
</html>
